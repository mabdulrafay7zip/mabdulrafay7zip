<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240" role="img" aria-label="Robo, the boxy green-headed robot">
  <title>Robo</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcff70"/>
      <stop offset=".5" stop-color="#b2e83a"/>
      <stop offset="1" stop-color="#5c8a12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d3d3d"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="eye" cx=".38" cy=".3" r=".95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#c6c6c6"/>
    </radialGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="100" cy="226" rx="52" ry="7" fill="#000000" opacity=".18"/>
  <!-- torso: tapered metallic body, lime center accent -->
  <path d="M78 128 L122 128 L110 196 L90 196 Z" fill="url(#metal)" stroke="#000000" stroke-width="1.5"/>
  <rect x="96" y="132" width="8" height="60" rx="4" fill="#c8ff2e" opacity=".9"/>
  <rect x="84" y="116" width="32" height="14" rx="5" fill="#222222"/>
  <!-- feet -->
  <rect x="80" y="196" width="18" height="11" rx="5" fill="#111111" stroke="#c8ff2e" stroke-width="1.2"/>
  <rect x="102" y="196" width="18" height="11" rx="5" fill="#111111" stroke="#c8ff2e" stroke-width="1.2"/>
  <!-- head: 3D cuboid illusion, turns toward an unseen pointer -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 100 76;7 100 76;-6 100 76" keyTimes="0;.5;1" dur="7s" repeatCount="indefinite"/>
    <!-- top face -->
    <path d="M28 34 L44 20 L172 20 L156 34 Z" fill="#eaffb0" opacity=".9"/>
    <!-- right side face + ring detail -->
    <path d="M156 34 L172 20 L172 104 L156 118 Z" fill="#2a3d12"/>
    <circle cx="164" cy="69" r="6" fill="none" stroke="#eaffb0" stroke-width="1.6" opacity=".85"/>
    <!-- front face -->
    <rect x="28" y="34" width="128" height="84" rx="14" fill="url(#face)" stroke="#eaffb0" stroke-width="2"/>
    <!-- eyes: protruding white spheres, no pupils -->
    <circle cx="64" cy="72" r="18" fill="url(#eye)"/>
    <circle cx="120" cy="72" r="18" fill="url(#eye)"/>
    <circle cx="57" cy="64" r="5" fill="#ffffff"/>
    <circle cx="113" cy="64" r="5" fill="#ffffff"/>
    <!-- turning shade: face darkens as the head turns -->
    <rect x="28" y="34" width="128" height="84" rx="14" fill="url(#shade)" opacity="0">
      <animate attributeName="opacity" values="0;.5;0" keyTimes="0;.5;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
